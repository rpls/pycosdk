[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "pycosdk"
dynamic = ["version"]
description = "Yet another wrapper for the PicoSDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Richard Petri", email="git@rpls.de"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["picoscope", "picotech", "picosdk", "oscilloscope", "ctypes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

[dependency-groups]
dev = [
  "mypy",
  "ruff",
]

[project.urls]
"Homepage" = "https://github.com/rpls/pycosdk"
"Bug Reports" = "https://github.com/rpls/pycosdk/issues"
"Source" = "https://github.com/rpls/pycosdk/"

[tool.uv]
# Rebuild on new commits/tags so the dynamic version stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# Untagged commits get the next minor version with a .devN suffix (N = commits
# since the last tag) and the commit as local version, e.g. 1.1.0.dev1+d5495c1
# after v1.0.0. Only builds of a tag are uploadable to PyPI.
bump = { enable = true, index = 1 }

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.mypy]
python_version = "3.11"
