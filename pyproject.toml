[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "pycosdk"
version = "0.1.1"
description = "Yet another wrapper for the PicoSDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Richard Petri", email="git@rpls.de"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["picoscope", "picotech", "picosdk", "oscilloscope", "ctypes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

[dependency-groups]
dev = [
  "mypy",
  "ruff",
]

[project.urls]
"Homepage" = "https://github.com/rpls/pycosdk"
"Bug Reports" = "https://github.com/rpls/pycosdk/issues"
"Source" = "https://github.com/rpls/pycosdk/"

[tool.mypy]
python_version = "3.11"
